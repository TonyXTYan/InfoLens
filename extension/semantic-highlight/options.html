<!DOCTYPE html>
<html lang="en" data-options-i18n="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic Highlight</title>
  <link rel="stylesheet" href="options-shell.css" />
  <link rel="stylesheet" href="options-new-dots.css" />
  <link rel="stylesheet" href="options-about.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <img id="brand_icon" class="top-icon" width="32" height="32" alt="">
      <span class="top-title">
        <span id="brand_name" class="top-name"></span>
        <span id="brand_version" class="top-version"></span>
      </span>
    </div>
  </header>
  <div class="layout">
  <nav class="side-nav" aria-label="Settings" data-i18n-attr="aria-label">
    <a href="#storage" data-i18n>Storage</a>
    <a href="#about" data-i18n>About</a>
  </nav>
  <main>
    <section id="storage">
    <h2 data-i18n>Storage</h2>
    <div class="group">
    <div class="row" data-option-id="analysis_cache">
      <div class="row-text">
        <div class="row-title" data-i18n>Analysis cache</div>
        <p id="cache_desc" class="row-desc"></p>
      </div>
      <button type="button" id="cache_clear" data-i18n>Clear</button>
    </div>
    </div>
    </section>
    <section id="about"></section>
  </main>
  </div>
  <script src="config.js"></script>
  <script src="options-about-zh.js"></script>
  <script src="zh.js"></script>
  <script src="options-i18n.js"></script>
  <script src="cache/ring-store.js"></script>
  <script src="semantic/analyzeCache.js"></script>
  <script src="sw/action-dot.js"></script>
  <script src="options-attention.js"></script>
  <script src="options-catalog.js"></script>
  <script src="options-new-dots.js"></script>
  <script src="options-nav.js"></script>
  <script src="aboutNote.js"></script>
  <script src="options-about.js"></script>
  <script src="options.js"></script>
</body>
</html>
