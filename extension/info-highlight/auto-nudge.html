<!DOCTYPE html>
<html lang="en" data-ih-i18n="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Info Highlight</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f1f1f;
      --muted: #5e5e5e;
      --bg: #fff;
      --btn-border: #747775;
      --bar: #1a73e8;
      --on-bar: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e3e3e3;
        --muted: #c4c7c5;
        --bg: #1f1f1f;
        --btn-border: #8e918f;
        --bar: #8ab4f8;
        --on-bar: #1f1f1f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.45 system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    main { max-width: 520px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 12px; overflow-wrap: anywhere; }
    p { margin: 0 0 12px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    button {
      font: inherit;
      font-weight: 500;
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    button.primary {
      background: var(--bar);
      border-color: var(--bar);
      color: var(--on-bar);
    }
    button.quiet {
      display: block;
      height: auto;
      margin-top: 14px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-weight: 400;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Always analyze this site?</h1>
    <p data-i18n>Next time you open this site, it analyzes automatically. No need to click.</p>
    <div class="actions">
      <button type="button" class="primary" id="agree" data-i18n>Always analyze this site</button>
      <button type="button" id="later" data-i18n>Later</button>
    </div>
    <button type="button" class="quiet" id="mute" data-i18n>Don't ask again</button>
  </main>
  <script src="config.js"></script>
  <script src="zh.js"></script>
  <script src="options-i18n.js"></script>
  <script src="i18n.js"></script>
  <script src="auto-sites.js"></script>
  <script src="auto-nudge.js"></script>
  <script src="auto-nudge-page.js"></script>
</body>
</html>
