<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Page not found — Info Lens</title>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            color-scheme: light dark;
            --fg: #222;
            --bg: #fff;
            --link: #06c;
            --muted: #666;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e3e3e3;
                --bg: #1f1f1f;
                --link: #8ab4f8;
                --muted: #aaa;
            }
        }
        body {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
            line-height: 1.6;
            color: var(--fg);
            background: var(--bg);
        }
        a { color: var(--link); }
        p { color: var(--muted); }
        html[lang="zh"] [lang="en"], html[lang="en"] [lang="zh"] { display: none; }
    </style>
    <script>
        (function () {
            var q = new URLSearchParams(location.search).get('lang');
            var s = null;
            try { s = localStorage.getItem('app_language'); } catch (e) {}
            var pref = q === 'zh' || q === 'en' ? q : s === 'zh' || s === 'en' ? s : (navigator.language || '');
            document.documentElement.lang = /^zh/i.test(pref || '') ? 'zh' : 'en';
        })();
    </script>
</head>

<body>
    <h1 lang="en">Page not found</h1>
    <h1 lang="zh">页面不存在</h1>
    <p lang="en">This URL is not a page on Info Lens.</p>
    <p lang="zh">这个地址在 Info Lens 上不存在。</p>
    <p>
        <a href="index.html"><span lang="en">Back to Info Lens</span><span lang="zh">返回 Info Lens</span></a>
    </p>
</body>

</html>
